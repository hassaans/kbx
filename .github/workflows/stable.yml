name: Stable

# CI builds with the Rust in rust-toolchain.toml, so a new stable can't turn it
# red. This runs the same checks on the latest stable once a week, to show what
# the next bump will have to fix. It never runs on a push or a pull request, so
# it can't block a merge. A failed run notifies by GitHub's default for scheduled
# workflows. See docs/releasing.md.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustc --version
      - run: cargo fmt --all --check
      # Each check runs even if the one before failed, so one run shows them all.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: ${{ !cancelled() }}
      - run: cargo test --workspace --locked
        if: ${{ !cancelled() }}
