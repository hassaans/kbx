name: TEMP watch repeat

on:
  push:
    branches: [fix-the-flaky-windows-watch-test-saves-that-outlast-the-window-index-the-note-on]

permissions:
  contents: read

jobs:
  ab:
    name: widened race windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package kbx --locked --test watch --no-run
      - shell: bash
        env:
          KBX_DIAG_WIDEN: "1"
        run: |
          set +e +o pipefail
          loop() {
            ok=0; bad=0
            for i in $(seq 1 12); do
              if cargo test --package kbx --locked --test watch saves_that_outlast > iter.log 2>&1; then ok=$((ok+1)); else bad=$((bad+1)); grep -a -E ' left:' iter.log | head -1 | cut -c1-120; fi
            done
            echo "AB $1 passed=$ok failed=$bad"
          }
          KBX_DIAG_UNFIXED=1 loop unfixed
          loop fixed
          exit 0
