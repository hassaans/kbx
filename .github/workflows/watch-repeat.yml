name: TEMP watch repeat

on:
  push:
    branches: [fix-the-flaky-windows-watch-test-saves-that-outlast-the-window-index-the-note-on]

permissions:
  contents: read

jobs:
  race:
    name: race ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package kbx --locked --bin kbx --no-run
      - shell: bash
        run: |
          set +e +o pipefail
          echo idle; cargo test --package kbx --locked --bin kbx diag_race -- --ignored --nocapture 2>&1 | grep -a -E 'DIAG-RACE|test result'
          for j in 1 2 3 4 5 6 7 8; do (while true; do yes > /dev/null; done) & done
          echo loaded; cargo test --package kbx --locked --bin kbx diag_race -- --ignored --nocapture 2>&1 | grep -a -E 'DIAG-RACE|test result'
          kill $(jobs -p) 2>/dev/null
          exit 0
