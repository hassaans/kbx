name: TEMP watch repeat

on:
  push:
    branches: [fix-the-flaky-windows-watch-test-saves-that-outlast-the-window-index-the-note-on]

permissions:
  contents: read

jobs:
  repeat:
    name: repeat ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package kbx --locked --test watch --no-run
      - shell: bash
        run: |
          for i in $(seq 1 50); do
            cargo test --package kbx --locked --test watch -- --test-threads=1 --exact saves_that_outlast_the_window_index_the_note_once a_burst_of_saves_to_one_note_indexes_it_once 2>&1 | grep -a -E '^test '
            echo "REPEAT $i of 50 passed"
          done
