[package]
name = "kbx-judge"
description = "LLM judge backends for kbx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
kbx-core = { version = "0.1.0", path = "../kbx-core" }
kbx-gen = { version = "0.1.0", path = "../kbx-gen" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
tracing = "0.1.44"
