[package]
name = "kbx-judge"
description = "LLM judge backends for kbx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
kbx-core = { version = "0.1.0", path = "../kbx-core" }
kbx-gen = { version = "0.1.0", path = "../kbx-gen" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tiny_http = "0.12"
