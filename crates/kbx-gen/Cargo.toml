[package]
name = "kbx-gen"
description = "Link candidate generators for kbx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
dirs = "6.0.0"
kbx-core = { version = "0.1.3", path = "../kbx-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tracing = "0.1.44"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Apple's BLAS comes with macOS, and is several times faster than candle's own.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["accelerate"] }

[dev-dependencies]
tiny_http = "0.12"
