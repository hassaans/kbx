[package]
name = "kbx-gen"
description = "Link candidate generators for kbx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kbx-core = { version = "0.1.3", path = "../kbx-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2"
tracing = "0.1.44"
