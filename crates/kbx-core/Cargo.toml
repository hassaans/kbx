[package]
name = "kbx-core"
description = "Vault parsing, ontology and graph storage for kbx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2"
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v5"] }
